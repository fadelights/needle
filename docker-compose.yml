# TODO: Add healthcheck to services
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    container_name: needle-${ENVIRONMENT}-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial
      - http.port=9200
    ports:
      - "${ES_HOST}:${ES_PORT}:9200" # TODO: Currently served on localhost to prevent security issues. Add auth and serve on all interfaces in the future.
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: needle-${ENVIRONMENT}-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_HOST}:${MINIO_PORT}:9000"
      - "${MINIO_HOST}:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - miniodata:/data
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped

volumes:
  esdata:
  miniodata:

networks:
  default:
    name: needle-${ENVIRONMENT}-network
